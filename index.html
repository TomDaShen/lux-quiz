<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>奢侈品鉴定刷题</title>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--fg:#e8eaf0;--dim:#8b93a7;--ok:#37c46e;--bad:#e5534b;--acc:#4f8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px}
h1{font-size:17px;margin:6px 0 10px;display:flex;align-items:center;gap:6px}
.home{font-size:13px;padding:3px 9px}
.modeOn{border-color:var(--acc);background:#254069;color:#fff}
select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid #2c3242;border-radius:10px;padding:9px 12px}
button{cursor:pointer}button:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid #2c3242;background:#222836;color:var(--fg);line-height:1.5}
.wbadge{border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:2px 8px;font-size:12px}
.fab{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:50;width:56px;height:56px;border-radius:50%;background:#254069;border:1px solid var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1.1;box-shadow:0 4px 14px rgba(0,0,0,.55)}
.fab small{font-size:9px;color:#bcd0ff}
.hide{display:none!important}.ts{font-size:10px;color:#5a6272;margin-left:6px;font-weight:600;white-space:nowrap}
.seg{display:flex;background:#1e2430;border:1px solid #2c3242;border-radius:12px;padding:3px;gap:3px;margin-top:12px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:9px 4px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chiprow button{padding:7px 11px;font-size:13px;border-radius:9px}
.examN{width:76px;padding:9px 6px;border-radius:10px;border:1px solid #2c3242;background:#222836;color:var(--fg);text-align:center}
.bmark{display:inline-flex;align-items:center;justify-content:center;color:#fff;border-radius:6px;font-weight:700;font-size:12px;padding:2px 7px;margin-right:6px}
.key{font-weight:600;margin-right:.4em;color:var(--dim)}
.opt.right{border-color:var(--ok);background:#173627;color:#c9f2d9}
.opt.wrong{border-color:var(--bad);background:#3a1c1c;color:#f4c1be}
.opt.sel{border-color:var(--acc)}
.card.judged button.opt{pointer-events:none}
.stat{color:var(--dim);font-size:13px;display:flex;justify-content:space-between;margin-top:10px}
.bar{height:5px;background:#232936;border-radius:3px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.done{margin-top:14px;text-align:center}
.done b{font-size:26px}
.muted{color:var(--dim);font-size:13px}
.next{display:block;width:100%;margin-top:12px;padding:12px;background:var(--acc);border:none;color:#fff}
.hidden{display:none}
.tfb{display:flex;gap:10px;margin-top:10px}.tfb .opt{text-align:center;font-size:17px;padding:16px}
.tag{font-size:11px;color:var(--dim);border:1px solid #333a4d;border-radius:6px;padding:1px 6px;margin-left:6px}
</style>
</head>

async function tryUnlock(){
  try {
    const enc = new TextEncoder();
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(LOCK.salt), iterations:LOCK.iter, hash:"SHA-256"},
      await crypto.subtle.importKey("raw", enc.encode(document.getElementById("pw").value.replace(/\s+/g, "").normalize("NFKC")), "PBKDF2", false, ["deriveKey"]),
      {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(LOCK.iv)}, key, b64(LOCK.ct));
    const text = new TextDecoder().decode(plain);
    BANKS = JSON.parse(text);
    state.unlockedTag = LOCK.tag; save();
    tryLS(() => localStorage.setItem(KEY + ".cache", text));
    renderHome();
  } catch(e) {
    const v = document.getElementById("pw").value;
    const hint = (/[\uFF10-\uFF19]/.test(v) ? "，收到全角数字" : "") + (/\s/.test(v) ? "，含空格" : "");
    document.getElementById("lerr").textContent = "密码不对，再试（收到 " + v.length + " 位" + hint + "）";
  }
}

function allQuestions(bank){ return bank === "__all__" ? Object.entries(BANKS).flatMap(([n, qs]) => qs.map(q => ({...q, b:n}))) : BANKS[bank].map(q => ({...q, b:bank})); }

let S = null; // session
function start(bank, mode){
  let qs = [], resKey = bank;
  if (bank === "__wrong__") {
    qs = Object.entries(state.wrong || {}).flatMap(([bn, nos]) => (BANKS[bn]||[]).filter(q => nos.includes(q.no)).map(q => ({...q, b:bn})));
    if (!qs.length) { renderHome(); alert("错题本是空的，先去刷题吧"); return; }
    const cnt = q => (((state.badTimes||{})[q.b]||{})[q.no]) || 0;
    qs.sort((a,b) => cnt(b) - cnt(a));  // 错得多的排前面

    qs = Object.entries(state.badTimes || {}).flatMap(([bn, mp]) =>
      (BANKS[bn]||[]).filter(q => (mp[q.no]||0) > 0).map(q => ({...q, b:bn})));
    if (!qs.length) { renderHome(); alert("还没有历史错题"); return; }
    const cnt = q => (((state.badTimes||{})[q.b]||{})[q.no]) || 0;
    qs.sort((a,b) => cnt(b) - cnt(a));
  } else if (bank === "__exam__") {

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} }
function pickRandom(qs, k){ const c = qs.slice(); shuffle(c); return c.slice(0, k); }
function pickExam(){
  const banks = Object.entries(BANKS).map(([name, qs]) => ({name, qs, sz: qs.length}));
  const T = banks.reduce((s, b) => s + b.sz, 0);

  } else {                                      // 3d(2): each bank >=1, rest proportional to bank size

    let rem = N - alloc.reduce((a, b) => a + b, 0);
    banks.map((b, i) => ({i, frac: w[i] - Math.floor(w[i])})).sort((a, b) => b.frac - a.frac)
      .forEach(({i}) => { while (rem > 0 && alloc[i] < banks[i].sz) { alloc[i]++; rem--; } });
    let over = alloc.reduce((a, b) => a + b, 0) - N;
    banks.slice().sort((a, b) => b.sz - a.sz).forEach(b => { const i = banks.indexOf(b);
      while (over > 0 && alloc[i] > 1) { alloc[i]--; over--; } });
    banks.forEach((b, i) => pickRandom(b.qs, alloc[i]).forEach(q => picked.push({b: b.name, q})));
  }
  const qs = picked.map(p => ({...p.q, b: p.b}));
  shuffle(qs);                                  // 3d(3): fully shuffled
  return qs;
}

// ---- render
function renderHome(){
  setFab(false);
  window.start = start; window.setUIMode = setUIMode; window.startExam = startExam; window.goHome = goHome;
  const rows = bankList();
  const total = rows.reduce((s,r)=>s+r.n,0);
  const wrongTotal = rows.reduce((s,r)=>s+r.w,0);
  const hist = new Set(Object.entries(state.badTimes||{}).flatMap(([bn, mp]) =>
    Object.keys(mp).filter(no => mp[no] > 0 && (BANKS[bn]||[]).some(q => String(q.no) === String(no))).map(no => bn+"#"+no))).size;
  const mode = (state.ui && state.ui.mode) || "drill";
  const seg = `<div class="seg">
    <button class="${mode==="drill"?"on":""}" onclick="setUIMode('drill')">📝 刷题</button>
    <button class="${mode==="study"?"on":""}" onclick="setUIMode('study')">📖 背题</button>
    <button class="${mode==="exam"?"on":""}" onclick="setUIMode('exam')">🖊 考试</button>
    <button onclick="showDocs()">📚 资料</button>
  </div>`;
  let ctl = "";
  if (mode === "drill") ctl = `
  <div class="row" style="margin-top:10px;justify-content:space-between;align-items:center">
    <button onclick="setRand()">🔀 顺序：${state.rand?"随机":"固定"}</button>
    <span class="muted">顺序作用于单库/错题刷题</span>
  </div>
  <div class="chiprow">
    <button onclick="start('__all__','rand')">🎲 全库混刷</button>
    <button onclick="start('__wrong__','seq')">📕 错题重刷 (${wrongTotal})</button>
    <button onclick="start('__bad__','seq')">🗂 历史错题 (${hist})</button>
    <button onclick="if(confirm('清空错题本和进度？')){resetAll()}">清空</button>
  </div>`;
  if (mode === "exam") ctl = `
  <div class="card">
    <div>考试规模：从全部 ${total} 题里按各题库题量比例抽题，每个题库至少 1 题，全部打散。</div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <input id="examN" class="examN" type="number" min="10" max="${total}" value="${state.examN||30}">
      <button class="next" style="width:auto;flex:1;margin-top:0" onclick="startExam()">开始考试 →</button>
    </div>
    <div class="muted" style="margin-top:8px">考试中不显示对错，交卷后统一出分；错题自动收进错题本。</div>
  </div>`;
  app.innerHTML = `
  <h1>奢侈品鉴定刷题 <span class="tag">${mode==="drill"?"刷题":mode==="study"?"背题":"考试"}</span></h1>
  <div class="muted">共 ${rows.length} 个题库 / ${total} 题 · 错题 ${wrongTotal} · 历史错题 ${hist} · ${VER}</div>
  ${seg}${ctl}
  ${mode==="exam"?"":`<div class="card">
  ${rows.map(r=>`<button class="opt opt-btn" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center" onclick="start(${JSON.stringify(r.name).replace(/"/g,'&quot;')},${mode==='study'?"'study'":"state.rand?'rand':'seq'"})">
    <span>${markOf(r.name)}${r.name} <span class="muted">${r.n}题</span></span>
    ${r.w?`<span class="wbadge" onclick="event.stopPropagation();start(${JSON.stringify(r.name).replace(/"/g,'&quot;')},'wrongOne')">错${r.w}题</span>`:""}
  </button>`).join("")}
  </div>`}`;
}
function setUIMode(m){ state.ui = Object.assign({mode:"drill"}, state.ui||{}); state.ui.mode = m; save(); renderHome(); }
function goHome(){ renderHome(); }
function setRand(){ state.rand = !state.rand; save(); renderHome(); }
function startExam(){
  const el = document.getElementById("examN");
  if (el) state.examN = Math.max(10, Math.min(263, parseInt(el.value) || state.examN || 30));
  save(); start("__exam__", "exam");
}
function setMode(v){ state.study = v; save(); renderHome(); }
function setRand(){ state.rand = !state.rand; save(); renderHome(); }
function startExam(){
  const el = document.getElementById("examN");
  if (el) state.examN = Math.max(16, Math.min(263, parseInt(el.value) || state.examN || 30));
  save(); start("__exam__", "exam");
}
function renderQ(){
  setFab(true);
  const q = S.qs[S.i];
  window.start = start;
  const totalDone = state.pos[S.bank] || 0;
  const letters = q.type === "tf" ? null : q.options.map((_, k) => "ABCD"[k]);
  const ansStr = (q.answer || []).join("");
  app.innerHTML = `
  <h1><button class="home" onclick="renderHome()">⌂ 主页</button>${S.mode==="wrongOne"?"❌ 错题重刷 · ":""}${S.exam?"📝 考试模式":markOf(q.b)+q.b} <span class="tag">${S.i+1}/${S.qs.length}</span></h1>
  <div class="card">
    <div>${q.stem}${q.type==="tf"?' <span class="tag">判断</span>':""}${q.type==="multi"?' <span class="tag">多选</span>':""}</div>
    ${q.type==="tf"
      ? `<div class="tfb"><button class="opt" data-k="T">✔️ 正确</button><button class="opt" data-k="F">✖️ 错误</button></div>`
      : q.options.map((o,k)=>`<button class="opt" data-multi="${q.type==="multi"}" data-k="${letters[k]}"><span class="key">${letters[k]}</span>${o}</button>`).join("")}
    <div class="stat"><span id="fb"></span><span id="posn">${S.exam?"考试模式 · 交卷出分":"本题库已刷 "+totalDone}</span></div>
    <div class="bar"><i style="width:${(S.i/S.qs.length*100)|0}%"></i></div>
    <button class="next hidden" id="nx">下一题 →</button>
  </div>`;
  let sel = new Set(), answered = false;
  app.querySelectorAll("button.opt").forEach(b => b.onclick = () => {
    if (b.dataset.multi === "true") {
      if (sel.has(b.dataset.k)) { sel.delete(b.dataset.k); b.classList.remove("sel"); }
      else { sel.add(b.dataset.k); b.classList.add("sel"); return; }
    } else {
      sel.clear(); sel.add(b.dataset.k);
    }
    judge(sel);
  });
  // keyboard 1-4 for desktop
  document.onkeydown = e => {
    const n = parseInt(e.key);
    if (S && letters && n >= 1 && n <= letters.length){ sel.clear(); sel.add(letters[n-1]); judge(sel); }
    if (S && e.key === "Enter" && !EL("nx").classList.contains("hidden")) EL("nx").click();
  };
  if (q.type === "multi") {
    // add submit button
    const s = document.createElement("button");
    s.className = "next"; s.textContent = "提交"; s.classList.remove("hidden");
    s.onclick = () => sel.size && judge(sel);
    app.querySelector(".tfb") || app.querySelector(".card").insertBefore(s, app.querySelector(".stat"));
  }
  function judge(sels){
    if (answered) return;          // 防连点/双击二次判分（会漏题）
    if (sels && !sels.size) return;
    answered = true;
    const picked = sels ? [...sels].sort().join("") : "";
    const ok = picked === ansStr;
    app.querySelector(".card").classList.add("judged");
    if (S.exam) {   // 考试模式：不判分不显答案，交卷后统一出分
      app.querySelectorAll(".opt").forEach(b => { if (!(b.dataset.multi==="true") && sels && sels.has(b.dataset.k||"")) b.classList.add("sel"); });
      S.picks[q.b + "#" + q.no] = picked;
      S.i++;
      const nx = EL("nx");
      nx.classList.remove("hidden"); nx.textContent = `下一题（${S.i}/${S.qs.length}）`;
      nx.onclick = () => S.i >= S.qs.length ? renderEnd() : renderQ();
      if (q.type === "multi" && app.querySelector(".next")) app.querySelector(".next").remove();
      return;
    }
    app.querySelectorAll(".opt").forEach(b => {
      const k = b.dataset.k || "";
      const isAns = ansStr.includes(k);
      const wasSel = sels && sels.has(k);
      b.classList.toggle("right", isAns);
      b.classList.toggle("wrong", !!wasSel && !isAns);
    });
    if (ok) S.right++; else S.wrong++;
    // record wrong
    const w = state.wrong[q.b] = state.wrong[q.b] || [];
    const idx = w.indexOf(q.no);
    if (ok) { if (idx >= 0) w.splice(idx, 1); }
    else {
      if (idx < 0) w.push(q.no);
      state.badTimes = state.badTimes || {};
      (state.badTimes[q.b] = state.badTimes[q.b] || {})[q.no] = ((state.badTimes[q.b] || {})[q.no] || 0) + 1;
    }
    state.pos[q.b] = (state.pos[q.b] || 0) + 1;
    EL("fb").innerHTML = ok ? `<span style="color:var(--ok)">✅ 正确，答案是 ${fmtAns(ansStr,q)} · 自动下一题</span>`
                            : `<span style="color:var(--bad)">❌ 错误，答案是 ${fmtAns(ansStr,q)}</span>`;
    S.i++;
    state.resume = state.resume || {};
    state.resume[S.res || S.bank] = S.i;
    save();
    const nx = EL("nx");
    nx.classList.remove("hidden");
    nx.onclick = () => S.i >= S.qs.length ? renderEnd() : renderQ();
    if (ok) setTimeout(() => { if (nx.isConnected) nx.click(); }, 900);  // ponytail: fixed 0.9s, add toggle if too fast
    if (q.type === "multi" && app.querySelector(".next")) app.querySelector(".next").remove();
  }
}
function renderStudyAll(qs, bank){
  setFab(true);
  window.start = start;
  const label = bank === "__all__" ? `全部题库 ${qs.length} 题` : bank === "__wrong__" ? `错题本 ${qs.length} 题` : `${bank} ${qs.length} 题`;
  const rows = qs.map(q => {
    const ansStr = (q.answer || []).join("");
    const tag = q.type==="tf"?' <span class="tag">判断</span>':(q.type==="multi"?' <span class="tag">多选</span>':"");
    const opts = q.type === "tf"
      ? `<div class="tfb"><button class="opt ${ansStr.includes("T")?"right":""}"><span class="key">T</span>✔️ 正确</button><button class="opt ${ansStr.includes("F")?"right":""}"><span class="key">F</span>✖️ 错误</button></div>`
      : q.options.map((o,k)=>`<button class="opt ${ansStr.includes("ABCD"[k])?"right":""}"><span class="key">${"ABCD"[k]}</span>${o}</button>`).join("");
    return `<div class="card"><div>${markOf(q.b)}${q.b} · ${q.no}. ${q.stem}${tag}</div>${opts}</div>`;
  }).join("");
  app.innerHTML = `<h1><button class="home" onclick="renderHome()">⌂ 主页</button>📖 背题 · ${label}</h1><div class="muted">绿色 = 正确答案</div>${rows}`;
}
function fmtAns(ans, q){
  if (q.type === "tf") return ans === "T" ? "✔️ 正确" : "✖️ 错误";
  return ans.split("").map(a => `${a}. ${q.options["ABCD".indexOf(a)]||""}`).join("，");
}
function renderEnd(){
  setFab(true);
  if (S.exam) {
    let right = 0; const wrongList = [];
    const bt = state.badTimes = state.badTimes || {};
    S.qs.forEach(q => {
      const ansStr = (q.answer || []).join("");
      const mine = S.picks[q.b + "#" + q.no] || "";
      if (mine === ansStr) { right++; return; }
      wrongList.push(`<div class="row" style="margin-top:8px"><div>❌ ${q.b} ${q.no}. ${q.stem.slice(0,40)}${q.stem.length>40?"…":""} — 正确 ${fmtAns(ansStr,q)||ansStr}</div></div>`);
      state.wrong[q.b] = state.wrong[q.b] || [];
      if (!state.wrong[q.b].includes(q.no)) state.wrong[q.b].push(q.no);
      (bt[q.b] = bt[q.b] || {})[q.no] = (bt[q.b][q.no] || 0) + 1;
    });
    save();
    const pct = Math.round(right / S.qs.length * 100);
    app.innerHTML = `
    <div class="done"><b style="color:${pct>=80?"var(--ok)":"var(--bad)"}">${pct}%</b>
    <div class="muted">考试 · 答对 ${right} / ${S.qs.length}${wrongList.length?`，错题已收进错题本`:``}</div></div>
    ${wrongList.join("")}
    <div class="row" style="justify-content:center;margin-top:14px">
      <button onclick="startExam()">再考一套</button>
      <button onclick="start('__wrong__','seq')">错题重刷</button>
      <button onclick="renderHome()">回首页</button>
    </div>`;
    return;
  }
  const pass = Math.round(S.right / S.qs.length * 100);
  const scoped = ["__wrong__","__bad__","__exam__","__all__"].includes(S.bank) ? "__wrong__" : S.bank;
  const scopeTip = scoped === "__wrong__" ? "全部错题" : scoped;
  app.innerHTML = `
  <div class="done"><b style="color:${pass>=80?"var(--ok)":"var(--bad)"}">${pass}%</b>
  <div class="muted">答对 ${S.right} / ${S.qs.length}${S.wrong?`，错题已收进错题本`:``}</div></div>
  <div class="row" style="justify-content:center;margin-top:14px">
    <button onclick="start('${S.bank}','${S.mode}')">再来一遍</button>
    <button onclick="start('${scoped}','wrongOne')">错题重刷（${scopeTip}）</button>
    <button onclick="start('__bad__','seq')">🗂 历史错题</button>
    <button onclick="renderHome()">回首页</button>
  </div>`;
}
function setFab(v){ const f = document.getElementById('fab'); f && f.classList.toggle('hide', !v); }
function boot(){
  const cache = tryLS(() => localStorage.getItem(KEY + ".cache"));
  if (LOCK.ct && cache && state.unlockedTag === LOCK.tag) {
    try { BANKS = JSON.parse(cache); } catch(e) {}
  }
  state.ui = state.ui || {mode: state.study ? "study" : "drill"};
  if (LOCK.ct && Object.keys(BANKS).length === 0) lockScreen(); else renderHome();
}
boot();
</script>
