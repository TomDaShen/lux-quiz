<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>奢侈品鉴定刷题</title>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--fg:#e8eaf0;--dim:#8b93a7;--ok:#37c46e;--bad:#e5534b;--acc:#4f8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;padding:0 0 32px}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px}
h1{font-size:17px;margin:6px 0 10px;display:flex;align-items:center;gap:6px}
.home{font-size:13px;padding:3px 9px}
.modeOn{border-color:var(--acc);background:#254069;color:#fff}
select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid #2c3242;border-radius:10px;padding:9px 12px}
button{cursor:pointer}button:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid #2c3242;background:#222836;color:var(--fg);line-height:1.5}
.key{font-weight:600;margin-right:.4em;color:var(--dim)}
.opt.right{border-color:var(--ok);background:#173627;color:#c9f2d9}
.opt.wrong{border-color:var(--bad);background:#3a1c1c;color:#f4c1be}
.opt.sel{border-color:var(--acc)}
.stat{color:var(--dim);font-size:13px;display:flex;justify-content:space-between;margin-top:10px}
.bar{height:5px;background:#232936;border-radius:3px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.done{margin-top:14px;text-align:center}
.done b{font-size:26px}
.muted{color:var(--dim);font-size:13px}
.next{display:block;width:100%;margin-top:12px;padding:12px;background:var(--acc);border:none;color:#fff}
.hidden{display:none}
.tfb{display:flex;gap:10px;margin-top:10px}.tfb .opt{text-align:center;font-size:17px;padding:16px}
.tag{font-size:11px;color:var(--dim);border:1px solid #333a4d;border-radius:6px;padding:1px 6px;margin-left:6px}
</style>
</head>

const KEY = "luxquiz.v1";
function tryLS(fn){ try { return fn(); } catch(e){ return null; } }
const state = tryLS(() => JSON.parse(localStorage.getItem(KEY) || '{"wrong":{},"pos":{}}')) || {"wrong":{},"pos":{}};
const save = () => tryLS(() => localStorage.setItem(KEY, JSON.stringify(state)));
function resetAll(){ tryLS(() => localStorage.removeItem(KEY)); location.reload(); }
const EL = id => document.getElementById(id);
const app = EL("app");

// ---- bank list with wrong counts
function bankList(){
  const rows = Object.entries(BANKS).map(([name, qs]) => ({
    name, n: qs.length, w: (state.wrong[name] || []).length
  }));
  rows.sort((a, b) => a.name.localeCompare(b.name, "zh"));
  return rows;
}
function allQuestions(bank){ return bank === "__all__" ? Object.entries(BANKS).flatMap(([n, qs]) => qs.map(q => ({...q, b:n}))) : BANKS[bank].map(q => ({...q, b:bank})); }

let S = null; // session
function start(bank, mode){
  let qs = bank === "__wrong__" ? [] : allQuestions(bank);
  if (bank === "__wrong__") {
    qs = Object.entries(state.wrong || {}).flatMap(([bn, nos]) => (BANKS[bn]||[]).filter(q => nos.includes(q.no)).map(q => ({...q, b:bn})));
    if (!qs.length) { renderHome(); alert("错题本是空的，先去刷题吧"); return; }
    const cnt = q => (((state.badTimes||{})[q.b]||{})[q.no]) || 0;
    qs.sort((a,b) => cnt(b) - cnt(a));  // 错得多的排前面
  }
  if (mode === "rand") shuffle(qs);
  state.resume = state.resume || {};
  S = {bank, mode, qs, i: mode === "rand" ? 0 : ((state.resume[bank] || 0) % qs.length), right:0, wrong:0};
  renderQ();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} }

// ---- render
function renderHome(){
  const rows = bankList();
  const total = rows.reduce((s,r)=>s+r.n,0);
  const wrongTotal = rows.reduce((s,r)=>s+r.w,0);
  app.innerHTML = `
  <h1>奢侈品鉴定刷题</h1>
  <div class="muted">共 ${rows.length} 个题库 / ${total} 题 · 错题 ${wrongTotal}</div>
  <div class="row" style="margin-top:12px">
    <button class="${!state.study?"modeOn":""}" onclick="setMode(false)">📝 刷题</button>
    <button class="${state.study?"modeOn":""}" onclick="setMode(true)">📖 背题</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button onclick="start('__all__','rand')">🎲 全库随机</button>
    <button onclick="start('__wrong__','seq')">📕 错题重刷 (${wrongTotal})</button>
    <button onclick="if(confirm('清空错题本和进度？')){resetAll()}">清空</button>
  </div>
  <div class="card">
  ${rows.map(r=>`<button class="opt opt-btn" style="margin-top:8px" onclick="start(${JSON.stringify(r.name).replace(/"/g,'&quot;')},state.study?'study':'seq')">
    ⭕ ${r.name} <span class="muted">${r.n}题</span>${r.w?` <span style="color:var(--bad)">错${r.w}</span>`:""}
  </button>`).join("")}
  </div>`;
  window.start = start;
  window.setMode = setMode;
}
function setMode(v){ state.study = v; save(); renderHome(); }
function renderQ(){
  const q = S.qs[S.i];
  window.start = start;
  const totalDone = state.pos[S.bank] || 0;
  const letters = q.type === "tf" ? null : q.options.map((_, k) => "ABCD"[k]);
  const ansStr = (q.answer || []).join("");
  app.innerHTML = `
  <h1><button class="home" onclick="renderHome()">⌂ 主页</button>${q.b} <span class="tag">${S.i+1}/${S.qs.length}</span></h1>
  <div class="card">
    <div>${q.stem}${q.type==="tf"?' <span class="tag">判断</span>':""}${q.type==="multi"?' <span class="tag">多选</span>':""}</div>
    ${q.type==="tf"
      ? `<div class="tfb"><button class="opt" data-k="T">✔️ 正确</button><button class="opt" data-k="F">✖️ 错误</button></div>`
      : q.options.map((o,k)=>`<button class="opt" data-multi="${q.type==="multi"}" data-k="${letters[k]}"><span class="key">${letters[k]}</span>${o}</button>`).join("")}
    <div class="stat"><span id="fb"></span><span id="posn">本题库已刷 ${totalDone}</span></div>

    <button class="next hidden" id="nx">下一题 →</button>
  </div>`;
  let sel = new Set();
  // study (背题) mode: answers pre-highlighted, any tap advances, nothing recorded
  if (S.mode === "study") {
    app.querySelectorAll(".opt").forEach(b => {
      const k = b.dataset.k || "";
      if (k && ansStr.includes(k)) b.classList.add("right");
      b.onclick = advance;
    });
    document.getElementById("nx").classList.remove("hidden");
    document.getElementById("nx").onclick = advance;
    document.getElementById("fb").innerHTML = `<span class="muted">📖 背题模式 · 绿色为正确答案，点击任意选项继续</span>`;
    document.getElementById("posn").textContent = "";
    return;
  }
  app.querySelectorAll("button.opt").forEach(b => b.onclick = () => {
    if (b.dataset.multi === "true") {
      if (sel.has(b.dataset.k)) { sel.delete(b.dataset.k); b.classList.remove("sel"); }
      else { sel.add(b.dataset.k); b.classList.add("sel"); return; }
    } else {
      sel.clear(); sel.add(b.dataset.k);
    }
    judge(sel);
  });
  // keyboard 1-4 for desktop
  document.onkeydown = e => {
    if (S.mode === "study"){ if (e.key === "Enter") document.getElementById("nx").click(); return; }
    const n = parseInt(e.key);
    if (S && letters && n >= 1 && n <= letters.length){ sel.clear(); sel.add(letters[n-1]); judge(sel); }
    if (S && e.key === "Enter" && !EL("nx").classList.contains("hidden")) EL("nx").click();
  };
  if (q.type === "multi") {
    // add submit button
    const s = document.createElement("button");
    s.className = "next"; s.textContent = "提交"; s.classList.remove("hidden");
    s.onclick = () => sel.size && judge(sel);
    app.querySelector(".tfb") || app.querySelector(".card").insertBefore(s, app.querySelector(".stat"));
  }
  function judge(sels){
    const picked = sels ? [...sels].sort().join("") : "";
    const ok = picked === ansStr;
    app.querySelectorAll(".opt").forEach(b => {
      const k = b.dataset.k || "";
      const isAns = ansStr.includes(k);
      const wasSel = sels && sels.has(k);
      b.classList.toggle("right", isAns);
      b.classList.toggle("wrong", !!wasSel && !isAns);
    });
    if (ok) S.right++; else S.wrong++;
    // record wrong
    const w = state.wrong[q.b] = state.wrong[q.b] || [];
    const idx = w.indexOf(q.no);
    if (ok) { if (idx >= 0) w.splice(idx, 1); }
    else {
      if (idx < 0) w.push(q.no);
      state.badTimes = state.badTimes || {};
      (state.badTimes[q.b] = state.badTimes[q.b] || {})[q.no] = ((state.badTimes[q.b] || {})[q.no] || 0) + 1;
    }
    state.pos[q.b] = (state.pos[q.b] || 0) + 1;
    EL("fb").innerHTML = ok ? `<span style="color:var(--ok)">✅ 正确，答案是 ${fmtAns(ansStr,q)} · 自动下一题</span>`
                            : `<span style="color:var(--bad)">❌ 错误，答案是 ${fmtAns(ansStr,q)}</span>`;
    S.i++;
    state.resume = state.resume || {};
    state.resume[S.bank] = S.i;
    save();
    const nx = EL("nx");
    nx.classList.remove("hidden");
    nx.onclick = () => S.i >= S.qs.length ? renderEnd() : renderQ();
    if (ok) setTimeout(() => { if (nx.isConnected) nx.click(); }, 900);  // ponytail: fixed 0.9s, add toggle if too fast
    if (q.type === "multi" && app.querySelector(".next")) app.querySelector(".next").remove();
  }
  function advance(){
    S.i++;
    state.resume[S.bank] = S.i;
    state.pos[q.b] = (state.pos[q.b] || 0) + 1;
    save();
    S.i >= S.qs.length ? renderEnd() : renderQ();
  }
}
function fmtAns(ans, q){
  if (q.type === "tf") return ans === "T" ? "✔️ 正确" : "✖️ 错误";
  return ans.split("").map(a => `${a}. ${q.options["ABCD".indexOf(a)]||""}`).join("，");
}
function renderEnd(){
  const pass = S.mode === "study" ? 100 : Math.round(S.right / S.qs.length * 100);
  const detail = S.mode === "study" ? "背题完成" : `答对 ${S.right} / ${S.qs.length}${S.wrong?`，错题已收进错题本`:``}`;
  app.innerHTML = `
  <div class="done"><b style="color:${pass>=80?"var(--ok)":"var(--bad)"}">${pass}%</b>
  <div class="muted">${detail}</div></div>
  <div class="row" style="justify-content:center;margin-top:14px">
    <button onclick="start('${S.bank}','${S.mode}')">再来一遍</button>
    <button onclick="start('__wrong__','seq')">错题重刷</button>
    <button onclick="renderHome()">回首页</button>
  </div>`;
}
renderHome();
</script>
</body>
</html>
